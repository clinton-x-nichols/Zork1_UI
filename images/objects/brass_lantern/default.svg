  <line x1="40" y1="28" x2="40" y2="58" stroke="#d4a017" stroke-width="1.5"/>
  <line x1="21" y1="43" x2="59" y2="43" stroke="#d4a017" stroke-width="1.5"/>
  <!-- top handle -->
  <rect x="35" y="18" width="10" height="8" fill="#d4a017"/>
  <rect x="32" y="15" width="16" height="4" rx="2" fill="#b8860b"/>
  <!-- light glow -->
