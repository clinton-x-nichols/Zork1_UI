<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a0a0a"/>
  
  <rect width="400" height="300" fill="#0a120a"/>
  <rect y="200" width="400" height="100" fill="#0d180d"/>
  <!-- many trees -->
  <polygon points="30,200 70,100 110,200" fill="#0d3d0d"/>
  <rect x="62" y="200" width="16" height="30" fill="#3a1e0a"/>
  <polygon points="80,200 120,90 160,200" fill="#0f4d0f"/>
  <rect x="112" y="200" width="16" height="30" fill="#3a1e0a"/>
  <polygon points="150,200 190,80 230,200" fill="#0d3d0d"/>
  <rect x="182" y="200" width="16" height="30" fill="#3a1e0a"/>
  <polygon points="220,200 260,100 300,200" fill="#0f4d0f"/>
  <rect x="252" y="200" width="16" height="30" fill="#3a1e0a"/>
  <polygon points="290,200 330,90 370,200" fill="#0d3d0d"/>
  <rect x="322" y="200" width="16" height="30" fill="#3a1e0a"/>
  <!-- shafts of light -->
  <line x1="100" y1="0" x2="90" y2="200" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
  <line x1="200" y1="0" x2="195" y2="200" stroke="#ffffff" stroke-width="2" opacity="0.04"/>
  <line x1="300" y1="0" x2="310" y2="200" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
  <!-- foliage overlay -->
  <ellipse cx="70" cy="90" rx="55" ry="35" fill="#0d400d" opacity="0.7"/>
  <ellipse cx="190" cy="75" rx="55" ry="35" fill="#0d500d" opacity="0.7"/>
  <ellipse cx="300" cy="85" rx="55" ry="35" fill="#0d400d" opacity="0.7"/>
  <text x="200" y="295" text-anchor="middle" fill="#4a8a4a" font-family="monospace" font-size="13">Forest</text>

</svg>