<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a0a0a"/>
  
  <rect width="400" height="300" fill="#020d18"/>
  <rect y="0" width="400" height="300" fill="#041428"/>
  <!-- underwater ambient light -->
  <radialGradient id="seaGlow" cx="50%" cy="40%" r="50%">
    <stop offset="0%" stop-color="#1a6090" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#020d18" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="300" fill="url(#seaGlow)"/>
  <!-- ancient columns -->
  <rect x="50" y="60" width="25" height="170" fill="#1a2a3a"/>
  <rect x="325" y="60" width="25" height="170" fill="#1a2a3a"/>
  <rect x="44" y="55" width="37" height="12" fill="#2a3a4a"/>
  <rect x="319" y="55" width="37" height="12" fill="#2a3a4a"/>
  <!-- trident on shore -->
  <line x1="200" y1="240" x2="200" y2="150" stroke="#88aadd" stroke-width="4"/>
  <line x1="185" y1="165" x2="200" y2="155" stroke="#88aadd" stroke-width="3"/>
  <line x1="215" y1="165" x2="200" y2="155" stroke="#88aadd" stroke-width="3"/>
  <line x1="193" y1="155" x2="200" y2="145" stroke="#88aadd" stroke-width="3"/>
  <line x1="207" y1="155" x2="200" y2="145" stroke="#88aadd" stroke-width="3"/>
  <!-- bubbles -->
  <circle cx="100" cy="100" r="4" fill="none" stroke="#5588aa" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="80" r="3" fill="none" stroke="#5588aa" stroke-width="1" opacity="0.4"/>
  <circle cx="150" cy="60" r="2" fill="none" stroke="#5588aa" stroke-width="1" opacity="0.6"/>
  <!-- sandy floor -->
  <rect y="240" width="400" height="60" fill="#1a180a"/>
  <text x="200" y="295" text-anchor="middle" fill="#5599bb" font-family="monospace" font-size="13">Atlantis Room</text>

</svg>