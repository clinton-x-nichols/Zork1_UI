<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a0a0a"/>
  
  <rect width="400" height="300" fill="#0d0d0d"/>
  <rect y="240" width="400" height="60" fill="#1a1210"/>
  <!-- stone walls texture -->
  <rect x="0" y="0" width="30" height="300" fill="#1a1210"/>
  <rect x="370" y="0" width="30" height="300" fill="#1a1210"/>
  <rect x="0" y="0" width="400" height="30" fill="#1a1210"/>
  <!-- stone blocks -->
  <line x1="30" y1="60" x2="370" y2="60" stroke="#222" stroke-width="2"/>
  <line x1="30" y1="120" x2="370" y2="120" stroke="#222" stroke-width="2"/>
  <line x1="30" y1="180" x2="370" y2="180" stroke="#222" stroke-width="2"/>
  <line x1="100" y1="30" x2="100" y2="240" stroke="#222" stroke-width="1"/>
  <line x1="200" y1="30" x2="200" y2="240" stroke="#222" stroke-width="1"/>
  <line x1="300" y1="30" x2="300" y2="240" stroke="#222" stroke-width="1"/>
  <!-- trapdoor above (open) -->
  <rect x="150" y="30" width="100" height="60" fill="#4a2c0a" opacity="0.7"/>
  <polygon points="150,30 155,0 245,0 250,30" fill="#3a1c0a" opacity="0.5"/>
  <!-- slide ramp -->
  <line x1="30" y1="240" x2="370" y2="190" stroke="#555" stroke-width="6"/>
  <!-- glow from north passage -->
  <ellipse cx="200" cy="250" rx="100" ry="20" fill="#ff6600" opacity="0.08"/>
  <text x="200" y="295" text-anchor="middle" fill="#888" font-family="monospace" font-size="13">Cellar</text>

</svg>