<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
<defs>
  <!-- Pre-dawn sky — shifting from black-purple to deep teal at horizon -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#010008"/>
    <stop offset="55%"  stop-color="#060220"/>
    <stop offset="85%"  stop-color="#0a1828"/>
    <stop offset="100%" stop-color="#0c2430"/>
  </linearGradient>
  <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#0c1808"/>
    <stop offset="100%" stop-color="#06100a"/>
  </linearGradient>
  <!-- Moon low on horizon, partly obscured -->
  <radialGradient id="moonHalo" cx="15%" cy="85%" r="35%">
    <stop offset="0%"   stop-color="#c8d0b0" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#0a1828" stop-opacity="0"/>
  </radialGradient>
  <!-- Dense mist layers -->
  <radialGradient id="mist1" cx="50%" cy="100%" r="80%">
    <stop offset="0%"   stop-color="#203028" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#0c2430" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="mist2" cx="30%" cy="100%" r="70%">
    <stop offset="0%"   stop-color="#1e2a22" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#0c2430" stop-opacity="0"/>
  </radialGradient>
  <!-- Faint horizon glow (false dawn) -->
  <radialGradient id="horizGlow" cx="50%" cy="100%" r="60%">
    <stop offset="0%"   stop-color="#304840" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#0c2430" stop-opacity="0"/>
  </radialGradient>
  <filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="b10"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="b16"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="b22"><feGaussianBlur stdDeviation="22"/></filter>
</defs>

<!-- SKY — pre-dawn, deeply unsettling teal-black -->
<rect width="600" height="450" fill="url(#sky)"/>

<!-- False dawn glow at horizon -->
<ellipse cx="300" cy="295" rx="400" ry="80" fill="url(#horizGlow)"/>

<!-- Moon low and setting, partly behind mist, sickly pale -->
<circle cx="88" cy="282" r="80" fill="url(#moonHalo)"/>
<circle cx="88" cy="282" r="46" fill="#c8d0a8" filter="url(#b2)"/>
<circle cx="88" cy="282" r="43" fill="#d0d8b0"/>
<ellipse cx="76"  cy="272" rx="12" ry="8"  fill="#b0b890" opacity="0.4"/>
<ellipse cx="96"  cy="290" rx="9"  ry="6"  fill="#b0b890" opacity="0.35"/>
<path d="M78 262 Q86 278 82 298" stroke="#989878" stroke-width="1.5" fill="none" opacity="0.4"/>
<!-- Moon-mist overlay (moon disappearing into fog) -->
<ellipse cx="88" cy="295" rx="70" ry="30" fill="#203028" opacity="0.55" filter="url(#b10)"/>

<!-- Few stars fading (dawn killing stars) -->
<circle cx="238" cy="12"  r="1.0" fill="#d0d0f8" opacity="0.5"/>
<circle cx="318" cy="8"   r="1.2" fill="#e0e0ff" opacity="0.45"/>
<circle cx="450" cy="18"  r="0.9" fill="#d0d0f8" opacity="0.42"/>
<circle cx="538" cy="14"  r="1.0" fill="#c0c0e8" opacity="0.5"/>
<circle cx="582" cy="28"  r="0.8" fill="#e0e0ff" opacity="0.38"/>
<circle cx="360" cy="30"  r="0.7" fill="#d0d0f8" opacity="0.35"/>
<circle cx="200" cy="22"  r="0.8" fill="#c0c0e8" opacity="0.42"/>

<!-- ═══ DENSE MIST LAYERS (many overlapping) ═══ -->
<!-- Deep back-layer mist -->
<rect x="0" y="260" width="600" height="190" fill="url(#mist1)" filter="url(#b16)"/>
<rect x="0" y="280" width="600" height="170" fill="url(#mist2)" filter="url(#b16)"/>

<!-- GROUND barely visible under mist -->
<rect y="294" width="600" height="156" fill="url(#gnd)"/>

<!-- Mist tendrils at various heights -->
<ellipse cx="300" cy="290" rx="320" ry="35"  fill="#263630" opacity="0.7"  filter="url(#b10)"/>
<ellipse cx="200" cy="300" rx="260" ry="28"  fill="#223030" opacity="0.65" filter="url(#b10)"/>
<ellipse cx="420" cy="295" rx="220" ry="24"  fill="#1e2c28" opacity="0.6"  filter="url(#b10)"/>
<ellipse cx="80"  cy="310" rx="180" ry="30"  fill="#263630" opacity="0.68" filter="url(#b10)"/>
<ellipse cx="520" cy="308" rx="160" ry="26"  fill="#223030" opacity="0.62" filter="url(#b10)"/>
<ellipse cx="300" cy="330" rx="300" ry="32"  fill="#1e2a24" opacity="0.55" filter="url(#b10)"/>
<ellipse cx="150" cy="345" rx="240" ry="28"  fill="#1c2820" opacity="0.5"  filter="url(#b10)"/>
<ellipse cx="450" cy="340" rx="200" ry="22"  fill="#1a2620" opacity="0.48" filter="url(#b10)"/>
<!-- Higher mist tendrils creeping up walls and trees -->
<ellipse cx="55"  cy="270" rx="90"  ry="42"  fill="#263630" opacity="0.45" filter="url(#b10)"/>
<ellipse cx="545" cy="268" rx="80"  ry="38"  fill="#223030" opacity="0.42" filter="url(#b10)"/>
<ellipse cx="300" cy="262" rx="140" ry="28"  fill="#1e2c28" opacity="0.32" filter="url(#b6)"/>
<!-- Tendrils reaching upward (most eerie — mist has will) -->
<ellipse cx="120" cy="248" rx="35"  ry="55"  fill="#263630" opacity="0.3"  filter="url(#b10)"/>
<ellipse cx="480" cy="250" rx="30"  ry="48"  fill="#223030" opacity="0.28" filter="url(#b10)"/>
<ellipse cx="240" cy="255" rx="28"  ry="42"  fill="#1e2c28" opacity="0.22" filter="url(#b6)"/>
<ellipse cx="380" cy="258" rx="25"  ry="38"  fill="#1e2c28" opacity="0.2"  filter="url(#b6)"/>

<!-- Far trees (barely ghosts in mist) -->
<rect x="18"  y="168" width="10" height="70" fill="#122018" opacity="0.5" rx="2"/>
<polygon points="12,178 23,128 34,178" fill="#162c1c" opacity="0.4"/>
<rect x="558" y="172" width="9"  height="66" fill="#122018" opacity="0.5" rx="2"/>
<polygon points="553,182 563,135 573,182" fill="#162c1c" opacity="0.4"/>

<!-- LEFT TREE (ghostly through mist) -->
<path d="M46 450 Q50 370 54 308 Q57 268 50 228" stroke="#0e1808" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.8"/>
<path d="M46 450 Q50 370 54 308 Q57 268 50 228" stroke="#182c14" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.7"/>
<path d="M46 450 Q50 370 54 308 Q57 268 50 228" stroke="#203820" stroke-width="13" fill="none" stroke-linecap="round" opacity="0.55"/>
<path d="M52 298 Q22 262 8 220"  stroke="#203820" stroke-width="9"  fill="none" stroke-linecap="round" opacity="0.45"/>
<path d="M54 268 Q36 238 16 206" stroke="#203820" stroke-width="7"  fill="none" stroke-linecap="round" opacity="0.4"/>
<path d="M54 292 Q78 256 96 218" stroke="#203820" stroke-width="8"  fill="none" stroke-linecap="round" opacity="0.42"/>
<path d="M50 228 Q32 198 26 166" stroke="#203820" stroke-width="6"  fill="none" stroke-linecap="round" opacity="0.35"/>
<path d="M50 228 Q62 208 58 176" stroke="#203820" stroke-width="5"  fill="none" stroke-linecap="round" opacity="0.35"/>
<!-- Knothole eye visible through mist (eerie) -->
<ellipse cx="52" cy="324" rx="5.5" ry="7.5" fill="#0c1a0c" stroke="#305030" stroke-width="1" opacity="0.7"/>
<ellipse cx="52" cy="324" rx="2.5" ry="3.5" fill="#205520" opacity="0.6"/>
<ellipse cx="52" cy="323" rx="1.2" ry="1.6" fill="#40ff40" opacity="0.2" filter="url(#b2)"/>

<!-- RIGHT TREE (ghostly) -->
<path d="M554 450 Q549 388 544 328 Q539 278 547 232" stroke="#182c14" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.62"/>
<path d="M554 450 Q549 388 544 328 Q539 278 547 232" stroke="#203820" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.5"/>
<path d="M544 298 Q564 262 580 226" stroke="#203820" stroke-width="6"  fill="none" stroke-linecap="round" opacity="0.38"/>
<path d="M544 268 Q526 242 518 212" stroke="#203820" stroke-width="5.5" fill="none" stroke-linecap="round" opacity="0.35"/>
<ellipse cx="546" cy="342" rx="4.5" ry="6.5" fill="#0c1a0c" stroke="#305030" stroke-width="1" opacity="0.6"/>
<ellipse cx="546" cy="342" rx="2"   ry="3"   fill="#205520" opacity="0.55"/>
<ellipse cx="546" cy="341" rx="1"   ry="1.4" fill="#40ff40" opacity="0.15" filter="url(#b2)"/>

<!-- HOUSE (half-dissolved in mist, only upper parts distinct) -->
<rect x="176" y="272" width="244" height="6" rx="3" fill="#040608" opacity="0.5"/>
<!-- House body (fading into mist below) -->
<rect x="182" y="104" width="232" height="174" fill="#c8c4b4" stroke="#aaa89a" stroke-width="1.5" opacity="0.75"/>
<!-- Masonry lines -->
<line x1="182" y1="144" x2="414" y2="144" stroke="#b0ac9c" stroke-width="0.6" opacity="0.35"/>
<line x1="182" y1="184" x2="414" y2="184" stroke="#b0ac9c" stroke-width="0.6" opacity="0.35"/>
<line x1="182" y1="224" x2="414" y2="224" stroke="#b0ac9c" stroke-width="0.6" opacity="0.35"/>
<!-- Mist consuming lower portion of house -->
<rect x="176" y="230" width="248" height="50" fill="#263630" opacity="0.55" filter="url(#b10)"/>
<rect x="176" y="255" width="248" height="30" fill="#263630" opacity="0.7"  filter="url(#b10)"/>

<!-- Roof -->
<polygon points="174,104 298,42 420,104" fill="#2c2216" stroke="#1e1608" stroke-width="2" opacity="0.85"/>
<line x1="238" y1="104" x2="276" y2="70"  stroke="#1e1608" stroke-width="0.9" opacity="0.4"/>
<line x1="318" y1="104" x2="318" y2="73"  stroke="#1e1608" stroke-width="0.9" opacity="0.4"/>
<line x1="398" y1="104" x2="356" y2="63"  stroke="#1e1608" stroke-width="0.9" opacity="0.4"/>

<!-- Chimney -->
<rect x="313" y="48" width="23" height="55" fill="#282016" stroke="#201808" stroke-width="1" opacity="0.85"/>
<rect x="310" y="44" width="29" height="8"  fill="#1a1404" opacity="0.85"/>
<!-- Chimney smoke wisps (adding to mist atmosphere) -->
<path d="M320 44 Q316 30 324 18 Q330 8 326 -2" stroke="#283828" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round"/>
<path d="M330 44 Q334 28 328 14 Q322 2 330 -6"  stroke="#283828" stroke-width="3" fill="none" opacity="0.28" stroke-linecap="round"/>

<!-- Windows (barely visible, green glow stronger through mist) -->
<rect x="196" y="122" width="76" height="58" fill="#303028" rx="2" opacity="0.85"/>
<rect x="198" y="124" width="72" height="54" fill="#201e14" stroke="#30281a" stroke-width="1" opacity="0.85"/>
<line x1="198" y1="124" x2="270" y2="178" stroke="#3a3014" stroke-width="4.5" opacity="0.75"/>
<line x1="270" y1="124" x2="198" y2="178" stroke="#3a3014" stroke-width="4.5" opacity="0.75"/>
<!-- Eldritch window glow enhanced by mist (scatters light) -->
<rect x="198" y="124" width="72" height="54" fill="#50c020" opacity="0.1"/>
<ellipse cx="234" cy="151" rx="40" ry="30" fill="#50c020" opacity="0.08" filter="url(#b10)"/>
<line x1="234" y1="124" x2="232" y2="178" stroke="#70d028" stroke-width="2"   opacity="0.22"/>
<line x1="246" y1="124" x2="249" y2="178" stroke="#70d028" stroke-width="1.5" opacity="0.16"/>

<rect x="322" y="122" width="76" height="58" fill="#303028" rx="2" opacity="0.85"/>
<rect x="324" y="124" width="72" height="54" fill="#201e14" stroke="#30281a" stroke-width="1" opacity="0.85"/>
<line x1="324" y1="124" x2="396" y2="178" stroke="#3a3014" stroke-width="4.5" opacity="0.75"/>
<line x1="396" y1="124" x2="324" y2="178" stroke="#3a3014" stroke-width="4.5" opacity="0.75"/>
<rect x="324" y="124" width="72" height="54" fill="#50c020" opacity="0.08"/>
<ellipse cx="360" cy="151" rx="40" ry="30" fill="#50c020" opacity="0.07" filter="url(#b10)"/>

<!-- Door -->
<rect x="266" y="196" width="62" height="82" fill="#30200c" stroke="#221408" stroke-width="2" opacity="0.78"/>
<line x1="266" y1="196" x2="328" y2="278" stroke="#402a0e" stroke-width="5" opacity="0.65"/>
<line x1="328" y1="196" x2="266" y2="278" stroke="#402a0e" stroke-width="5" opacity="0.65"/>
<line x1="266" y1="237" x2="328" y2="237" stroke="#402a0e" stroke-width="3.5" opacity="0.65"/>

<!-- Elder sign above door (glowing faintly in mist) -->
<g transform="translate(297,193) scale(0.9)" opacity="0.45">
  <polygon points="0,-16 9.2,8 -9.2,8"  fill="none" stroke="#a0c060" stroke-width="1.8"/>
  <polygon points="0,16 9.2,-8 -9.2,-8" fill="none" stroke="#a0c060" stroke-width="1.8"/>
  <circle cx="0" cy="0" r="5.5" fill="none" stroke="#a0c060" stroke-width="1.4"/>
  <circle cx="0" cy="0" r="2"   fill="#a0c060" opacity="0.35" filter="url(#b2)"/>
</g>

<!-- MAILBOX (ghostly, partially mist-obscured) -->
<path d="M114 315 Q116 285 115 250" stroke="#3a3c30" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.55"/>
<rect x="87" y="226" width="57" height="28" rx="4" fill="#182440" stroke="#304060" stroke-width="1.5" opacity="0.65"/>
<path d="M87 240 Q115.5 232 144 240 L144 226 Q115.5 218 87 226Z" fill="#1c2e58" stroke="#304060" stroke-width="1.4" opacity="0.65"/>
<!-- Faint mist around mailbox -->
<ellipse cx="115" cy="240" rx="55" ry="22" fill="#203028" opacity="0.5" filter="url(#b10)"/>

<!-- THICK GROUND MIST (foreground) — semi-opaque -->
<ellipse cx="300" cy="350" rx="310" ry="45"  fill="#1e2e28" opacity="0.82" filter="url(#b6)"/>
<ellipse cx="150" cy="370" rx="250" ry="38"  fill="#1a2a22" opacity="0.75" filter="url(#b6)"/>
<ellipse cx="450" cy="365" rx="220" ry="35"  fill="#1c2c26" opacity="0.72" filter="url(#b6)"/>
<ellipse cx="300" cy="400" rx="300" ry="42"  fill="#1e3028" opacity="0.78" filter="url(#b6)"/>
<ellipse cx="100" cy="420" rx="180" ry="30"  fill="#182820" opacity="0.7"  filter="url(#b6)"/>
<ellipse cx="500" cy="415" rx="160" ry="28"  fill="#1a2a22" opacity="0.68" filter="url(#b6)"/>

<!-- Faint path stones barely visible through mist -->
<ellipse cx="220" cy="370" rx="24" ry="8" fill="#141a10" opacity="0.35"/>
<ellipse cx="255" cy="350" rx="20" ry="7" fill="#121812" opacity="0.3"/>

<!-- Label (barely legible through mist) -->
<text x="300" y="442" text-anchor="middle" fill="#3a4c3e" font-family="monospace"
      font-size="11" letter-spacing="3" opacity="0.55">WEST OF HOUSE</text>
<text x="300" y="432" text-anchor="middle" fill="#304840" font-family="monospace"
      font-size="9" letter-spacing="2" opacity="0.4">— the mist gathers —</text>
</svg>
