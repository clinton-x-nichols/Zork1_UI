<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#010008"/>
    <stop offset="65%" stop-color="#08012a"/>
    <stop offset="100%" stop-color="#110240"/>
  </linearGradient>
  <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#081004"/>
    <stop offset="100%" stop-color="#030804"/>
  </linearGradient>
  <radialGradient id="moonHalo" cx="76%" cy="18%" r="30%">
    <stop offset="0%" stop-color="#c8bc50" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#08012a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="winGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#40b800" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#40b800" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="mbxGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#d0b000" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#c09000" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#a07000" stop-opacity="0"/>
  </radialGradient>
  <filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="b5"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="b8"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="b12"><feGaussianBlur stdDeviation="12"/></filter>
</defs>

