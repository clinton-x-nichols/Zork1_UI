<rect x="89" y="234" width="53" height="18" fill="url(#mbxGlow)" opacity="0.55"/>

<!-- Leaflet visible inside, slightly out — glowing with strange runes -->
<g transform="translate(94, 230) rotate(-8)">
  <rect x="0" y="0" width="32" height="22" rx="2" fill="#ece4b0" opacity="0.95"/>
  <!-- Rune lines -->
  <line x1="3" y1="5"  x2="29" y2="5"  stroke="#604020" stroke-width="1"   opacity="0.8"/>
  <line x1="3" y1="9"  x2="26" y2="9"  stroke="#604020" stroke-width="1"   opacity="0.72"/>
  <line x1="3" y1="13" x2="29" y2="13" stroke="#604020" stroke-width="1"   opacity="0.72"/>
  <line x1="3" y1="17" x2="22" y2="17" stroke="#604020" stroke-width="1"   opacity="0.64"/>
  <!-- Eye of Yog at corner -->
  <ellipse cx="26" cy="14" rx="4.5" ry="5.5" fill="none" stroke="#8a4010" stroke-width="0.9" opacity="0.75"/>
  <ellipse cx="26" cy="14" rx="1.8" ry="2.2" fill="#8a4010" opacity="0.55"/>
  <!-- Faint eldritch glow on leaflet -->
  <rect x="0" y="0" width="32" height="22" rx="2" fill="#ffc000" opacity="0.08"/>
</g>

<!-- Mailbox lid swung open/upward (rotated back) -->
<g transform="rotate(-65, 87, 232)">
  <path d="M87 232 Q115.5 224 144 232 L144 222 Q115.5 211 87 222Z"
        fill="#1e3464" stroke="#3a4e72" stroke-width="1.5"/>
  <!-- Inside-lid runes -->
  <text x="115" y="229" text-anchor="middle" font-size="6" fill="#90c0f0" opacity="0.45"
        font-family="monospace" letter-spacing="2">∴ ⋱ ∵</text>
</g>

<!-- Flag (UP — mail present) -->
<rect x="143" y="222" width="3" height="18" fill="#3a2e1e"/>
<rect x="143" y="213" width="12" height="9" fill="#8a2010" rx="1"/>

