<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a0a0a"/>
  
  <rect width="400" height="300" fill="#0a0818"/>
  <!-- sky with stars -->
  <rect y="0" width="400" height="120" fill="#050a14"/>
  <circle cx="60" cy="30" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="150" cy="15" r="1" fill="white" opacity="0.8"/>
  <circle cx="250" cy="40" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="350" cy="20" r="1" fill="white" opacity="0.9"/>
  <circle cx="380" cy="50" r="2" fill="white" opacity="0.4"/>
  <!-- rainbow arc -->
  <path d="M 50,100 Q 200,20 350,100" fill="none" stroke="#ff0000" stroke-width="3" opacity="0.6"/>
  <path d="M 55,106 Q 200,28 345,106" fill="none" stroke="#ff8800" stroke-width="2" opacity="0.6"/>
  <path d="M 60,112 Q 200,36 340,112" fill="none" stroke="#ffff00" stroke-width="2" opacity="0.5"/>
  <path d="M 65,118 Q 200,44 335,118" fill="none" stroke="#00ff00" stroke-width="2" opacity="0.5"/>
  <path d="M 70,123 Q 200,52 330,123" fill="none" stroke="#0000ff" stroke-width="2" opacity="0.5"/>
  <!-- canyon walls -->
  <path d="M 0,120 L 80,150 L 0,300" fill="#1a1010"/>
  <path d="M 400,120 L 320,150 L 400,300" fill="#1a1010"/>
  <!-- waterfalls -->
  <rect x="100" y="130" width="15" height="170" fill="#3a7aaa" opacity="0.6"/>
  <rect x="285" y="130" width="15" height="170" fill="#3a7aaa" opacity="0.6"/>
  <!-- forest below -->
  <path d="M 0,260 Q 100,230 200,255 Q 300,230 400,260 L 400,300 L 0,300 Z" fill="#0d2d0d"/>
  <text x="200" y="295" text-anchor="middle" fill="#7799bb" font-family="monospace" font-size="13">Canyon View</text>

</svg>