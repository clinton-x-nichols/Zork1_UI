<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a0a0a"/>
  
  <rect width="400" height="300" fill="#1a0e0a"/>
  <!-- floor -->
  <rect y="210" width="400" height="90" fill="#3a2010"/>
  <!-- rug -->
  <ellipse cx="200" cy="240" rx="120" ry="40" fill="#8b0000" opacity="0.7"/>
  <!-- walls -->
  <rect x="0" y="0" width="20" height="300" fill="#2a1508"/>
  <rect x="380" y="0" width="20" height="300" fill="#2a1508"/>
  <!-- trophy case -->
  <rect x="280" y="120" width="80" height="90" fill="#5c3a1a" stroke="#d4a017" stroke-width="2"/>
  <rect x="285" y="125" width="70" height="80" fill="#1a0e0a" opacity="0.5"/>
  <line x1="320" y1="120" x2="320" y2="210" stroke="#d4a017" stroke-width="1"/>
  <!-- trapdoor in rug -->
  <rect x="155" y="225" width="60" height="40" fill="#4a2c0a" stroke="#888" stroke-width="2" opacity="0.8"/>
  <line x1="155" y1="245" x2="215" y2="245" stroke="#888" stroke-width="2"/>
  <!-- sword on wall -->
  <line x1="80" y1="60" x2="80" y2="130" stroke="#8888cc" stroke-width="4"/>
  <polygon points="65,60 95,60 80,45" fill="#8888cc"/>
  <rect x="65" y="115" width="30" height="8" fill="#d4a017"/>
  <!-- lantern on table -->
  <rect x="120" y="165" width="60" height="10" fill="#5c3a1a"/>
  <polygon points="135,140 165,140 170,165 130,165" fill="#d4a017" opacity="0.8"/>
  <circle cx="150" cy="152" r="10" fill="#ffcc00" opacity="0.6"/>
  <text x="200" y="295" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">Living Room</text>

</svg>