<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a0a0a"/>
  
  <rect width="400" height="300" fill="#050005"/>
  <!-- dark red fog -->
  <radialGradient id="hadesGlow" cx="50%" cy="60%" r="60%">
    <stop offset="0%" stop-color="#440000" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#050005" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="300" fill="url(#hadesGlow)"/>
  <!-- ghostly figures -->
  <ellipse cx="100" cy="150" rx="20" ry="40" fill="#aaaacc" opacity="0.15"/>
  <ellipse cx="300" cy="120" rx="18" ry="35" fill="#aaaacc" opacity="0.12"/>
  <ellipse cx="200" cy="180" rx="22" ry="45" fill="#aaaacc" opacity="0.1"/>
  <!-- gate -->
  <rect x="150" y="80" width="100" height="140" fill="none" stroke="#4a0000" stroke-width="3"/>
  <rect x="160" y="80" width="3" height="140" fill="#3a0000"/>
  <rect x="237" y="80" width="3" height="140" fill="#3a0000"/>
  <rect x="150" y="80" width="100" height="8" fill="#3a0000"/>
  <line x1="160" y1="90" x2="237" y2="90" stroke="#4a0000" stroke-width="2"/>
  <!-- eerie ground -->
  <rect y="220" width="400" height="80" fill="#0d0005"/>
  <!-- bone remains -->
  <ellipse cx="80" cy="240" rx="15" ry="10" fill="#888" opacity="0.4"/>
  <line x1="80" y1="250" x2="80" y2="270" stroke="#888" stroke-width="2" opacity="0.4"/>
  <text x="200" y="295" text-anchor="middle" fill="#880000" font-family="monospace" font-size="13">Entrance to Hades</text>

</svg>